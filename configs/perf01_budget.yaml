schema_version: "perf01.v0.1"
date: "2026-09-18"
status: "engineering_estimate_pending_confirmation"
owner: "Technical Lead"

# 已由用户确认的三个PERF-01验收航速点；不是运行结果。
acceptance_speed_mps: [35.0, 50.0, 70.0]

target_airborne_platform:
  status: "engineering_reference_estimate"
  model: "NVIDIA Jetson Orin NX 16GB"
  cpu: "8-core Arm Cortex-A78AE"
  accelerator: "1024-core Ampere GPU, 32 Tensor Cores, 2x NVDLA"
  memory_gb: 16.0
  power_mode: "25W"
  power_w: 25.0
  instantaneous_power_limit_w: null
  power_headroom_w: 5.0
  power_headroom_semantics: "engineering_budget_allowance; not vendor limit"
  measurement_method: "on-board power telemetry plus external power monitor"
  source: "NVIDIA official Jetson Orin specifications; reference estimate, not selected hardware"

reference_sensors:
  radar:
    model: "ARS548"
    status: "reference_identity_only"
    frequency_hz: null
    fov_deg:
      horizontal: 120.0
      vertical: 30.0
    range_m: 300.0
    range_semantics: "effective_reference_range_user_provided"
    point_rate_hz: null
    timestamp_error_ms: null
    source: "user-provided project reference; selected configuration/data sheet still to be bound"
  infrared:
    status: "engineering_reference_estimate"
    model: "Micro III Lite 640 Uncooled Micro Thermal Camera Core"
    variant: "non-radiometric 640; 9.1mm F1.0 lens provisional"
    resolution: [640, 512]
    frame_rate_hz: 50.0
    fov_deg:
      horizontal: 48.1
      vertical: 38.4
    exposure_interval_ms: 20.0
    timestamp_error_ms: 5.0
    timestamp_error_semantics: "engineering_budget_assumption; verify with external trigger"
    power_w: 0.50
    source: "manufacturer product page for core; lens/FOV and timing are provisional project assumptions"
  lidar_supervision:
    model: "mid360"
    mode: "training_data_generation_only"
    online_sensor_bundle: false
    online_perception_input: false
    mapping_input: false
    note: "Reference coverage only; preserve observed_mask and unknown semantics."

motion_error:
  equation: "translation_error_m = speed_mps * data_age_s"
  candidate_data_age_ms: [5.0, 10.0, 20.0, 50.0]
  acceptance_threshold_m: 1.5
  angular_motion: "speed / turn_radius"
  threshold_semantics: "initial engineering estimate; not scenario acceptance"

scene:
  altitude_m: 50.0
  altitude_reference: "AGL"
  obstacle_size_m: 2.0
  obstacle_distance_m: 200.0
  forward_detection_distance_m: 300.0
  turn_radius_m: 250.0
  angular_rate_rad_s:
    "35": 0.14
    "50": 0.20
    "70": 0.28
  semantics: "low_altitude_fixed_wing_reference_estimate"

timing_contract:
  percentiles: [p50, p95, p99]
  stages:
    - radar_ir_receive
    - synchronization
    - sensor_bundle_ready
    - perception_start
    - perception_end
    - occupancy_ready
    - map_update_start
    - map_update_end
    - map_snapshot_publish
  max_radar_ir_delta_ms: 5.0
  max_pose_age_ms: 10.0
  max_end_to_end_age_ms: 20.0
  max_p99_latency_ms: 20.0
  max_timeout_rate: 0.01
  max_drop_rate: 0.01

map_budget:
  resolution_m: 0.5
  coverage_m:
    forward: 300.0
    lateral: 120.0
    vertical: 60.0
  update_rate_hz: 20.0
  memory_limit_mb: 1024.0
  staleness_limit_ms: 100.0
  semantics: "initial_local_map_reference_estimate"

validation:
  status: "not_started"
  required_evidence:
    - monotonic_stage_timestamps
    - p50_p95_p99_latency
    - sensor_sync_and_pose_age
    - input_output_drop_duplicate_out_of_order_rates
    - resource_and_power_measurement
    - continuous_run_stability
