# SIM-01B已确认工程验收门槛；不是PERF-01高速飞行性能预算。
# 来源：docs/SIM01B_RECORDING_REPLAY_PLAN.md第4至6节。
# 大纳秒值使用十进制字符串，避开ROS1参数服务器32位整数限制；消费者转int。
min_valid_span_ns: '300000000000'
source_limit_ns: '600000000000'
max_gap_ns: '500000000'
# 三个会话分别计墙钟上限；drain是完成条件的截止时间，不是固定sleep。
wall_limit_s: 900.0
startup_timeout_s: 60.0
drain_timeout_s: 5.0
replay_progress_timeout_s: 2.0
# writer上限沿用A原始订阅量级，溢出立即失败，不能静默丢弃。
writer_queue_limit: 10000
# 总验证方案：clock请求50Hz、ODOMETRY请求20Hz；以下为有效采样频率下限。
min_clock_hz: 40.0
min_state_hz: 10.0
# 三次会话顺序运行、独立Master；端口被占用时不停止既有进程。
live_master_port: 11341
b1_master_port: 11342
b2_master_port: 11343
# Noetic原生播放器TimePublisher先advertise相对clock队列1；仅播放器使用私有namespace，
# bag的绝对/clock首次注册使用--queue1000。内部clock不启用生成，公共话题名称不变。
native_player_namespace: '/sim01b_native'
